{{- $lang := .Get 0 -}}
{{- $opts := .Get 1 | default "" -}}
<div class="highlight-wrap">
    {{- transform.Highlight (trim .Inner "\n") $lang $opts -}}
</div>

<style>
    .highlight-wrap pre {
        text-wrap: auto;
        overflow-wrap: break-word
    }

    .highlight-wrap .pre_nolines.line .ln {
        display: inline !important;
    }
</style>
