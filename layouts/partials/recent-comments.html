{{- with .Site.Data.recent_comments }}
{{- with .comments }}
<h2 class="mt-4">Recent Comments</h2>
<ul class="recent_comments flex-column">
  {{- range . }}
  <li class="recent_comment">
    <a href="/{{ .discussionTitle }}#comments" title="{{ .discussionTitle }}">
      {{- if .avatar }}
      <img src="{{ .avatar }}&s=48" alt="{{ .author }}" loading="lazy" width="24" height="24">
      {{- end }}
      <div class="recent_comment_body">
        <div class="recent_comment_meta">
          <span class="recent_comment_author">{{ .author }}</span>
          <span class="recent_comment_sep"> · </span>
          <time class="recent_comment_time" datetime="{{ .createdAt }}">{{ .createdAt }}</time>
        </div>
        <p class="recent_comment_snippet">{{ .snippet }}</p>
      </div>
    </a>
  </li>
  {{- end }}
</ul>

<style>
  .recent_comments {
    list-style: none; padding-left: 0;
  }
  .recent_comment {
    margin: -1rem 0;
  }
  .recent_comment a {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    text-decoration: none;
    color: inherit;
  }
  .recent_comment a:hover .recent_comment_snippet {
    text-decoration: underline;
  }
  .recent_comment img {
    border-radius: 50%;
    flex: 0 0 24px;
    margin-top: 2px;
  }
  .recent_comment_body { min-width: 0; flex: 1; }
  .recent_comment_meta { font-size: 1.0rem; opacity: 0.75; }
  .recent_comment_author { font-weight: 600; }
  .recent_comment_snippet {
    margin: 0.1rem 0 0;
    font-size: 1.0rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const rel = (iso) => {
      const d = new Date(iso);
      const s = (Date.now() - d.getTime()) / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      if (s < 604800) return Math.floor(s / 86400) + 'd ago';
      return d.toLocaleDateString();
    };
    document.querySelectorAll('.recent_comment_time').forEach((el) => {
      const iso = el.getAttribute('datetime');
      if (iso) el.textContent = rel(iso);
    });
  });
</script>
{{- end }}
{{- end }}
