name: Refresh recent comments

on:
  schedule:
    - cron: '0 */2 * * *'
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: recent-comments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest comments from Discussions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  discussions(first: 50, orderBy: {field: UPDATED_AT, direction: DESC}) {
                    nodes {
                      title
                      url
                      number
                      comments(last: 20) {
                        nodes {
                          body
                          createdAt
                          url
                          author { login avatarUrl url }
                          replies(last: 20) {
                            nodes {
                              body
                              createdAt
                              url
                              author { login avatarUrl url }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const flat = [];
            const push = (n, d) => flat.push({
              author: n.author?.login || 'ghost',
              avatar: n.author?.avatarUrl || '',
              authorUrl: n.author?.url || '',
              body: n.body || '',
              createdAt: n.createdAt,
              url: n.url,
              discussionTitle: d.title,
              discussionUrl: d.url,
            });

            for (const d of result.repository.discussions.nodes) {
              for (const c of d.comments.nodes) {
                push(c, d);
                for (const r of c.replies.nodes) push(r, d);
              }
            }

            flat.sort((a, b) => b.createdAt.localeCompare(a.createdAt));

            const top = flat.slice(0, 5).map(c => ({
              ...c,
              snippet: c.body
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`[^`]*`/g, ' ')
                .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/[#>*_~\-]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 100),
            }));

            const out = {
              updated: new Date().toISOString(),
              comments: top,
            };

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync(
              'data/recent_comments.json',
              JSON.stringify(out, null, 2) + '\n',
            );

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain data/recent_comments.json)" ]; then
            git add data/recent_comments.json
            git commit -m "chore: refresh recent comments"
            git push
          else
            echo "No changes to recent_comments.json"
          fi
